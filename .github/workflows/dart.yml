

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      
  push:
    branches:
      - main
      
name: "Build & Release"
jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Dart

        uses: dart-lang/setup-dart@v1

      - name: Install dependencies

        run: dart pub get

      - name: Analyze project source

        run: dart analyze

      - name: Run tests

        run: dart test






